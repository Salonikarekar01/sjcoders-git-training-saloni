<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center mb-4">Employee Management</h1>


        <!-- Success / Error Message -->
        <div id="message"></div>


        <!-- Employee Form -->
        <div class="card mb-4">

            <div class="card-body">

                <h3 class="card-title mb-3">Add Employee</h3>

                <form id="employeeForm">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label for="employeeCode" class="form-label">
                                Employee Code
                            </label>

                            <input type="text" class="form-control" id="employeeCode" required>
                        </div>


                        <div class="col-md-6 mb-3">
                            <label for="fullName" class="form-label">
                                Full Name
                            </label>

                            <input type="text" class="form-control" id="fullName" required>
                        </div>

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">
                                Email
                            </label>

                            <input type="email" class="form-control" id="email" required>
                        </div>


                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">
                                Phone
                            </label>

                            <input type="text" class="form-control" id="phone" required>
                        </div>

                    </div>


                    <div class="row">

                        <div class="col-md-4 mb-3">
                            <label for="department" class="form-label">
                                Department
                            </label>

                            <input type="text" class="form-control" id="department" required>
                        </div>


                        <div class="col-md-4 mb-3">
                            <label for="role" class="form-label">
                                Role
                            </label>

                            <input type="text" class="form-control" id="role" required>
                        </div>


                        <div class="col-md-4 mb-3">
                            <label for="status" class="form-label">
                                Status
                            </label>

                            <select class="form-select" id="status" required>
                                <option value="">Select Status</option>
                                <option value="ACTIVE">ACTIVE</option>
                                <option value="INACTIVE">INACTIVE</option>
                            </select>
                        </div>

                    </div>


                    <button type="submit" class="btn btn-primary">
                        Save Employee
                    </button>

                </form>

            </div>

        </div>


        <!-- Search Box -->
        <div class="mb-3">

            <input type="text" class="form-control" id="searchInput" placeholder="Search employees...">

        </div>


        <!-- Employee Table -->
        <div class="table-responsive">

            <table class="table table-bordered table-striped">

                <thead class="table-dark">

                    <tr>
                        <th>ID</th>
                        <th>Employee Code</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Role</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody id="employeeTableBody">

                    <!-- Employees will be added here using JavaScript -->

                </tbody>

            </table>

        </div>

    </div>


    <script src="js/app.js"></script>

</body>

</html>
